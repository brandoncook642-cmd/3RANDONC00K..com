<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Brandon Cook</title>

    <script>
        try {
            document.documentElement.classList.toggle('light-mode', localStorage.getItem('theme') === 'light');
        } catch { }
    </script>
    <link rel="stylesheet" href="../css/style.css">

    <!--icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">3RAND0N C00K</a>

        <button class="menu-icon" aria-label="Open navigation" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="skills.html">Skills</a>
            <a href="experience.html">Experience</a>
            <a href="education.html">Education</a>
            <a href="contact.html" class="active" aria-current="page">Contact</a>
        </nav>

        <div class="button">
            <a href="../CV.pdf/B Cook - CV.pdf" class="btn" target="_blank" rel="noopener noreferrer">My CV</a>
        </div>

        <button class="theme-toggle" type="button" aria-label="Toggle theme">
            <i class="fa-solid fa-lightbulb"></i>
        </button>
    </header>

    <section class="contact" id="contact">
        <div class="contact-layout">
            <div class="contact-copy">
                <h2 class="heading">Contact Me</h2>
                <p>If you have a question or an opportunity to discuss, send me a message. I will get back to you as
                    soon as I can.</p>

                <div class="contact-links" aria-label="Direct contact">
                    <a class="contact-link" href="mailto:brandoncook642@gmail.com">
                        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                        <span>brandoncook642@gmail.com</span>
                    </a>
                    <a class="contact-link" href="tel:+64223634402">
                        <i class="fa-solid fa-phone" aria-hidden="true"></i>
                        <span>+64 22 363 4402</span>
                    </a>
                </div>
            </div>

            <form action="https://formspree.io/f/mnpazvok" method="POST">
                <div class="input-box">
                    <div class="input-field">
                        <label for="name">Name</label>
                        <input id="name" type="text" name="name" placeholder="Name" autocomplete="name" required>
                    </div>
                    <div class="input-field">
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email" placeholder="Email" autocomplete="email" required>
                    </div>
                </div>

                <div class="input-box">
                    <div class="input-field">
                        <label for="phone">Phone number</label>
                        <input id="phone" type="tel" name="phone" placeholder="Phone number" autocomplete="tel"
                            required>
                    </div>
                    <div class="input-field">
                        <label for="subject">Subject</label>
                        <input id="subject" type="text" name="subject" placeholder="Subject or inquiry" required>
                    </div>
                </div>

                <div class="textarea-field">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="7" placeholder="Write your message" required></textarea>
                </div>

                <div class="form-actions">
                    <div class="button">
                        <button type="submit" class="btn">Send message</button>
                    </div>
                </div>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 BRANDON.com. All rights reserved.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>

</html>
